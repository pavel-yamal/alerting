# Один узел alerting + PostgreSQL в Docker. Порядок запуска и смысл каждого шага —
# docs/12-docker.md. Коротко:
#
#   ./docker/up.sh     — всё ниже одной командой
#
#   cp docker/.env.example docker/.env
#   docker compose --env-file docker/.env --profile init run --rm org-init   # ТОЛЬКО демо
#   # вписать ALERTING_ROOT_PUBKEY из вывода в docker/.env
#   docker compose --env-file docker/.env up -d --wait
#
# Секреты не ходят через окружение: они генерируются в томах, каждый файл 0400 и
# принадлежит тому процессу, который его читает.

name: alerting

x-app: &app
  image: alerting:${ALERTING_IMAGE_TAG:-local}
  build: .
  restart: unless-stopped
  environment: &app-env
    ALERTING_ORG: ${ALERTING_ORG:-acme}
    ALERTING_ORG_LABEL: ${ALERTING_ORG_LABEL:-ACME}
    ALERTING_ROOT_PUBKEY: ${ALERTING_ROOT_PUBKEY:-}
    ALERTING_NODE_ID: ${ALERTING_NODE_ID:-app-1}
    ALERTING_LOG_LEVEL: ${ALERTING_LOG_LEVEL:-INFO}
    ALERTING_LOG_JSON: ${ALERTING_LOG_JSON:-1}
    ALERTING_DRILL_SITES: ${ALERTING_DRILL_SITES:-}
    ALERTING_ALLOW_STUB_CHANNELS: ${ALERTING_ALLOW_STUB_CHANNELS:-0}
    ALERTING_CANARY_INTERVAL_S: ${ALERTING_CANARY_INTERVAL_S:-3600}

services:
  # Пароли и DSN, один раз. Повторный запуск ничего не перезаписывает.
  secrets-init:
    image: busybox:1.36
    restart: "no"
    command: ["sh", "/secrets-init.sh"]
    volumes:
      - ./docker/secrets-init.sh:/secrets-init.sh:ro
      - db-secrets:/db
      - owner-secrets:/owner
      - app-secrets:/app

  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    depends_on:
      secrets-init: {condition: service_completed_successfully}
    environment:
      POSTGRES_PASSWORD_FILE: /secrets/postgres-password
    volumes:
      - db-secrets:/secrets:ro
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d alerting"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Наружу база не публикуется: к ней ходят только контейнеры этой сети.

  # Миграции — ролью владельца, отдельным одноразовым контейнером, до сервера.
  migrate:
    <<: *app
    restart: "no"
    command: ["migrate"]
    healthcheck: {disable: true}
    depends_on:
      db: {condition: service_healthy}
    environment:
      <<: *app-env
      ALERTING_DSN_FILE: /run/alerting-owner/dsn
    volumes:
      - owner-secrets:/run/alerting-owner:ro

  server:
    <<: *app
    depends_on:
      migrate: {condition: service_completed_successfully}
    command:
      - serve
      - --host=0.0.0.0
      - --port=8080
      - --workers=${ALERTING_WORKERS:-2}
      - --forwarded-allow-ips=${ALERTING_FORWARDED_ALLOW_IPS:-}
    environment:
      <<: *app-env
      ALERTING_DSN_FILE: /run/alerting-app/dsn
      ALERTING_SERVER_KEY_FILE: /run/alerting-app/server-key
    volumes:
      - app-secrets:/run/alerting-app:ro
      - heads:/var/lib/alerting/heads
      - spool:/var/lib/alerting/spool
    ports:
      # По умолчанию только localhost: TLS терминирует nginx на хосте
      # (deploy/nginx/alerting.conf). Открывать этот порт в сеть напрямую нельзя.
      # Снаружи 7070, чтобы не пересекаться с другими сервисами на 8080; внутри
      # контейнера и в сети compose сервер по-прежнему на 8080.
      - "${ALERTING_BIND:-127.0.0.1}:${ALERTING_PORT:-7070}:8080"
    stop_grace_period: 45s

  # Веб-панель дежурного и ЛПР. Ключ человека живёт в его браузере (телефон, iPad,
  # рабочее место): приказы подписываются там, панель получает только подписи
  # (docs/adr/0012-browser-device-keys.md). Демо-вход с ключами из тома clients
  # остаётся для показа (ALERTING_PANEL_DEMO_KEYS=1) — в нём ключ расшифровывается
  # здесь, на сервере; для реальной работы его выключают.
  panel:
    <<: *app
    depends_on:
      server: {condition: service_healthy}
    entrypoint: ["alerting-panel"]
    command: ["--host=0.0.0.0", "--port=8090"]
    environment:
      ALERTING_PANEL_SERVER: http://server:8080
      ALERTING_PANEL_HOMES: /var/lib/alerting/clients
      ALERTING_PANEL_ORG: ${ALERTING_ORG:-acme}
      ALERTING_PANEL_ROOT_PUBKEY: ${ALERTING_ROOT_PUBKEY:-}
      # Наибольшие виденные версии справочника, отзывов и политики. На томе, а не в
      # контейнере: пересоздание контейнера не должно сбрасывать защиту от отката.
      ALERTING_PANEL_STATE: /var/lib/alerting/panel
      ALERTING_PANEL_SERVER_KEYS: ${ALERTING_PANEL_DEMO_KEYS:-1}
      ALERTING_LOG_LEVEL: ${ALERTING_LOG_LEVEL:-INFO}
    volumes:
      - clients:/var/lib/alerting/clients
      - panel-state:/var/lib/alerting/panel
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=4)"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    ports:
      # Свой адрес привязки, отдельно от API. Ключ устройства работает только по
      # https:// (или localhost): наружу и в сеть — через обратный прокси с TLS.
      - "${ALERTING_PANEL_BIND:-127.0.0.1}:${ALERTING_PANEL_PORT:-7071}:8090"

  # Клиент исполнителя с веб-страницей для телефона. Тоже КЛИЕНТ: держит ключ
  # устройства исполнителя, слушает поток приказов и проверяет каждый по корневому
  # ключу организации. Демонстрация потока, а не замена нативному приложению:
  # проверка идёт здесь, а не в телефоне (docs/12-docker.md §9).
  mobile:
    <<: *app
    depends_on:
      server: {condition: service_healthy}
    entrypoint: ["alerting-mobile"]
    command: ["--host=0.0.0.0", "--port=8091"]
    environment:
      ALERTING_MOBILE_SERVER: http://server:8080
      ALERTING_MOBILE_HOMES: /var/lib/alerting/clients
      # Токен администратора для `alerting-mobile sessions` / `end-session`.
      ALERTING_MOBILE_STATE: /var/lib/alerting/mobile
      ALERTING_LOG_LEVEL: ${ALERTING_LOG_LEVEL:-INFO}
    volumes:
      - clients:/var/lib/alerting/clients
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/healthz', timeout=4)"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    ports:
      # Отдельный адрес привязки: чтобы открыть страницу с телефона в той же сети,
      # ставят ALERTING_MOBILE_BIND=0.0.0.0 — осознанно и только на стенде.
      - "${ALERTING_MOBILE_BIND:-127.0.0.1}:${ALERTING_MOBILE_PORT:-7072}:8091"

  # ДЕМО-организация. Стирает схему и пишет корневой закрытый ключ на диск —
  # на боевом сервере не запускать никогда (docs/02-trust-and-approval.md).
  org-init:
    <<: *app
    profiles: ["init"]
    restart: "no"
    healthcheck: {disable: true}
    depends_on:
      db: {condition: service_healthy}
    entrypoint: ["sh", "-c"]
    command:
      - >-
        python /opt/alerting/scripts/org_init.py --i-understand-this-is-a-demo
        --org "$$ALERTING_ORG" --dsn "$$(cat /run/alerting-owner/dsn)"
        --home /var/lib/alerting/clients --secrets-dir /var/lib/alerting/demo-keys
        && install -m 0400 /var/lib/alerting/demo-keys/server-key.SECRET
        /run/alerting-app/server-key.new
        && mv -f /run/alerting-app/server-key.new /run/alerting-app/server-key
    volumes:
      - owner-secrets:/run/alerting-owner:ro
      - app-secrets:/run/alerting-app
      - clients:/var/lib/alerting/clients
      - demo-keys:/var/lib/alerting/demo-keys

  # CLI ЛПР, исполнителя и аудитора: docker compose run --rm cli alerting-approver ...
  cli:
    <<: *app
    profiles: ["cli"]
    restart: "no"
    healthcheck: {disable: true}
    entrypoint: []
    command: ["alerting-approver", "--help"]
    volumes:
      - clients:/var/lib/alerting/clients

volumes:
  pgdata:
  db-secrets:
  owner-secrets:
  app-secrets:
  heads:
  spool:
  clients:
  demo-keys:
  panel-state:
