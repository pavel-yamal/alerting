# Quorum and scenario policy. This file's CONTENT is signed as a bundle by the org
# root key (see docs/02-trust-and-approval.md) — the file on disk is the source, the
# signed bundle is what clients trust.
#
# A policy the server could rewrite would let a compromised server set m=1 and approve
# its own orders, so it travels the same pinned-root path as the key directory.
#
# The codebook (which events exist) is the scenarios: key, kept in its own file:
# config/scenarios.example.yaml. Sign both with `alerting-org sign-policy` and publish
# with `alerting-org publish` -- docs/02-trust-and-approval.md §5.

policy_id: "demo-policy-2026-01"
org_id: "acme"
version: 1

# Roles whose signatures may count toward a quorum. REQUIRED, with no default, for the
# same reason the drill flag has none: a policy that does not say who may approve must
# be unusable, not permissive.
#
# Only the decision-makers (ЛПР) issue orders. Executors are deliberately absent:
# their device keys exist only to sign acknowledgements — counting them would let two
# executors launch a critical evacuation and one stand it down. So is the duty
# officer (a temporary role): watches, keeps the directory, signs nothing.
approver_roles:
  - lpr

# People choose only "drill" or "real"; the level of an order comes from its scenario
# (its min_severity, else max_severity). Every order AND every stand-down -- drill or
# real, any level -- needs two DIFFERENT decision-makers (docs/adr/0003-cancel-quorum.md).
# `m` can still be changed per level here: sign and publish the policy.
#
# distinct_persons counts HUMANS, not keys: one person with two enrolled devices must
# not be able to satisfy 2-of-N alone.
#
# There is no time limit on collecting signatures: a proposal waits until the second
# decision-maker signs it, and every decision-maker sees it waiting.
severities:
  info:
    launch: {m: 2, distinct_persons: true}
    cancel: {m: 2, distinct_persons: true}

  warning:
    launch: {m: 2, distinct_persons: true}
    cancel: {m: 2, distinct_persons: true}

  critical:
    launch: {m: 2, distinct_persons: true}
    cancel: {m: 2, distinct_persons: true}

  catastrophic:
    launch: {m: 2, distinct_persons: true}
    cancel: {m: 2, distinct_persons: true}
