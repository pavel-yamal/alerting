[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alerting"
version = "0.1.0"
description = "Verifiable emergency order dispatch: signed orders, M-of-N quorum, hash-chained audit"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "websockets>=12",
    "httpx>=0.27",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
alerting-approver = "alerting.clients.approver_cli:main"
alerting-executor = "alerting.clients.executor_cli:main"
alerting-auditor = "alerting.clients.auditor_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/alerting"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "B008",  # FastAPI dependency injection idiom
    # This project is written in Russian. Cyrillic that resembles Latin is the
    # content, not a homoglyph attack, and the wordlist would be unreadable with
    # these on.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"scripts/**" = ["E402"]

[tool.mypy]
python_version = "3.11"
packages = ["alerting"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "alerting.core.*"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:alerting.*"]
