# Alerting — TLS termination and reverse proxy.
#
# Install to /etc/nginx/conf.d/alerting.conf. Paths marked ADJUST are site-specific.
#
# Why --proxy-headers is safe here: once phase 4 lands, HTTP requests are signed over
# method + path + body hash, so nothing this proxy sets can grant authority. Until
# then the shared API key is checked by the application, also above this layer.

upstream alerting_app {
    # One node in phase 1. Phase 6 adds the second; no ip_hash is needed even then,
    # because dispatch is triggered by the approver's request, which lands on an
    # arbitrary node — stickiness would not help.
    least_conn;
    server 10.0.10.11:8080 max_fails=2 fail_timeout=5s;   # ADJUST
    keepalive 16;
}

limit_req_zone  $binary_remote_addr zone=alerting_write:10m rate=10r/s;
limit_req_zone  $binary_remote_addr zone=alerting_read:10m  rate=30r/s;
limit_conn_zone $binary_remote_addr zone=alerting_ws:10m;

server {
    listen 443 ssl;
    http2 on;
    server_name alerting.example.internal;                # ADJUST

    # An internal emergency system almost certainly uses the corporate CA, not ACME.
    ssl_certificate     /etc/ssl/alerting/fullchain.pem;   # ADJUST
    ssl_certificate_key /etc/ssl/alerting/privkey.pem;     # ADJUST
    include /etc/nginx/conf.d/alerting-tls-params.conf;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    # Proposals and ACKs are small; nothing here uploads.
    client_max_body_size 64k;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The executor's alert stream. It is idle for hours by design, which is the whole
    # point of the long read timeout — and why the app also sends its own WebSocket
    # pings every 20s, since a middlebox may not honour this timeout.
    location /v1/stream {
        proxy_pass http://alerting_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        limit_conn alerting_ws 10;
    }

    # Writes: proposals, signatures, ACKs, forcing an audit head.
    location ~ ^/v1/(proposals|acks|audit/head) {
        limit_req zone=alerting_write burst=20 nodelay;
        proxy_pass http://alerting_app;
    }

    # The audit chain can be a long read even bounded at 1000 entries per page.
    location /v1/audit {
        limit_req zone=alerting_read burst=10;
        proxy_read_timeout 60s;
        proxy_pass http://alerting_app;
    }

    # Liveness and readiness carry no secrets but are still not public: readiness
    # names which subsystem is broken, which is a gift to somebody probing.
    location ~ ^/v1/(healthz|readyz)$ {
        allow 127.0.0.1;
        allow 10.0.10.0/24;                                # ADJUST: LB and app subnet
        deny all;
        access_log off;
        proxy_pass http://alerting_app;
    }

    location /v1/ {
        limit_req zone=alerting_read burst=20;
        proxy_pass http://alerting_app;
    }

    # Nothing else is served. No static files, no directory listing, no default app.
    location / {
        return 404;
    }
}

# Plain HTTP exists only to redirect. There is no reason for this service to answer
# a non-TLS request with anything else.
server {
    listen 80;
    server_name alerting.example.internal;                 # ADJUST
    return 301 https://$host$request_uri;
}
