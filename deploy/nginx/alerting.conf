# Alerting — TLS termination and reverse proxy.
#
# Install to /etc/nginx/conf.d/alerting.conf. Paths marked ADJUST are site-specific.
#
# Why --proxy-headers is safe here: the application checks a per-person Ed25519
# signature over each request's method, path, QUERY STRING and body hash. Nothing
# this proxy sets can grant authority, and nothing it could rewrite in a path or a
# query survives verification.
#
# The query string is in that list deliberately. An earlier note here promised only
# "method + path + body hash", which would have left ?from_idx=…&limit=… free to
# rewrite -- the auditor pages the chain with exactly those.

upstream alerting_app {
    # Two nodes, and deliberately no ip_hash: dispatch is triggered by the approver's
    # request, which lands on an arbitrary node anyway, so stickiness buys nothing and
    # costs an uneven failover.
    #
    # `max_fails` is what takes an unfit node out, and what makes that correct is the
    # readiness check below: a node pointed at a database in recovery answers 503 on
    # every route -- it can read everything and record nothing. Without `proxy_next_
    # upstream`, nginx would forward that 503 to the approver instead of trying the
    # other node.
    least_conn;
    server 10.0.10.11:8080 max_fails=2 fail_timeout=5s;   # ADJUST
    server 10.0.10.12:8080 max_fails=2 fail_timeout=5s;   # ADJUST
    keepalive 16;
}

limit_req_zone  $binary_remote_addr zone=alerting_write:10m rate=10r/s;
limit_req_zone  $binary_remote_addr zone=alerting_read:10m  rate=30r/s;
limit_conn_zone $binary_remote_addr zone=alerting_ws:10m;

server {
    listen 443 ssl;
    http2 on;
    server_name alerting.example.internal;                # ADJUST

    # An internal emergency system almost certainly uses the corporate CA, not ACME.
    ssl_certificate     /etc/ssl/alerting/fullchain.pem;   # ADJUST
    ssl_certificate_key /etc/ssl/alerting/privkey.pem;     # ADJUST
    include /etc/nginx/conf.d/alerting-tls-params.conf;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    # Proposals and ACKs are small; nothing here uploads.
    client_max_body_size 64k;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # A node that cannot write answers 503, and an alert must not stop there while a
    # healthy node is standing by.
    #
    # `non_idempotent` is included on purpose, and the reason is the per-request nonce
    # (ADR 0008): each signed request carries one, and the server claims it in
    # `http_nonces` before the handler runs. So a retry of a request the first node
    # DID process is refused as a replay -- a confusing 401, but never a second order.
    # A retry of one it did not process (it could not claim the nonce either, claiming
    # is a write) goes through normally. Duplication is the outcome that is impossible
    # here; that is what makes retrying a POST acceptable at all.
    proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
    proxy_next_upstream_tries 2;

    # The executor's alert stream. It is idle for hours by design, which is the whole
    # point of the long read timeout — and why the app also sends its own WebSocket
    # pings every 20s, since a middlebox may not honour this timeout.
    location /v1/stream {
        proxy_pass http://alerting_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        limit_conn alerting_ws 10;
    }

    # Writes: proposals, signatures, ACKs, forcing an audit head.
    location ~ ^/v1/(proposals|acks|audit/head) {
        limit_req zone=alerting_write burst=20 nodelay;
        proxy_pass http://alerting_app;
    }

    # The audit chain can be a long read even bounded at 1000 entries per page.
    location /v1/audit {
        limit_req zone=alerting_read burst=10;
        proxy_read_timeout 60s;
        proxy_pass http://alerting_app;
    }

    # Liveness and readiness carry no secrets but are still not public: readiness
    # names which subsystem is broken, which is a gift to somebody probing.
    location ~ ^/v1/(healthz|readyz)$ {
        allow 127.0.0.1;
        allow 10.0.10.0/24;                                # ADJUST: LB and app subnet
        deny all;
        access_log off;
        # Never retried, unlike everything else. Readiness is a question ABOUT a node,
        # and `proxy_next_upstream` would answer it with a different node: an unready
        # node's 503 would be retried, the healthy one would answer 200, and the very
        # condition this route exists to expose would be hidden by the proxy.
        #
        # A balancer in front of nginx should probe each node at its own address for
        # the same reason. This route is here for a human with curl.
        proxy_next_upstream off;
        proxy_pass http://alerting_app;
    }

    # Metrics. Aggregates only -- no person_id, no name, no phone number, which is
    # exactly what lets this sit behind an IP allowlist instead of the signature gate
    # a scraper cannot pass. /v1/statusz names who is connected and stays signed.
    #
    # Narrower than healthz/readyz on purpose: the scraper is one host, not the whole
    # app subnet, and this answer is a fuller picture of the system than readiness is.
    #
    # Pinned to one node, not the upstream. Every value is computed from the shared
    # database at scrape time (ADR 0009), so both nodes answer the same for cluster-
    # wide numbers -- but not for the per-node ones: whether THIS node holds the
    # escalation lock, whether ITS database is in recovery, what ITS channel probes
    # see. Round-robin across two nodes would make those flap between scrapes.
    # Scrape each node separately, by its own address.
    location = /v1/metricsz {
        allow 127.0.0.1;
        allow 10.0.10.20/32;                               # ADJUST: the scraper
        deny all;
        access_log off;
        proxy_pass http://10.0.10.11:8080;                 # ADJUST: this node only
    }

    location /v1/ {
        limit_req zone=alerting_read burst=20;
        proxy_pass http://alerting_app;
    }

    # Nothing else is served. No static files, no directory listing, no default app.
    location / {
        return 404;
    }
}

# Plain HTTP exists only to redirect. There is no reason for this service to answer
# a non-TLS request with anything else.
server {
    listen 80;
    server_name alerting.example.internal;                 # ADJUST
    return 301 https://$host$request_uri;
}
