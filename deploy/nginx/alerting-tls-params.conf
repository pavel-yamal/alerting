# Shared TLS parameters. Install to /etc/nginx/conf.d/alerting-tls-params.conf.

ssl_protocols TLSv1.2 TLSv1.3;
# Leave cipher preference to the client: modern clients pick better than a hardcoded
# list that ages badly.
ssl_prefer_server_ciphers off;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

ssl_session_timeout 1d;
ssl_session_cache shared:AlertingSSL:10m;
ssl_session_tickets off;

# OCSP stapling. Harmless with a corporate CA that does not publish OCSP; the
# resolver line is what makes it work when it does.
ssl_stapling on;
ssl_stapling_verify on;
