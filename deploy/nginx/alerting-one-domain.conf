# Alerting on ONE name: the panel (and the approver app) and the API under one domain.
#
#   https://<домен>/        панель ЛПР и дежурного: страница, /api/*, /privacy
#   https://<домен>/v1/     API сервера: консоль, страница исполнителя, аудитор
#
# Paths do not overlap: the panel serves only /, /api/*, /privacy, /healthz and its
# two scripts; the server serves only /v1/*. The approver app needs just this one
# address -- it talks to the panel, and the panel talks to the server inside, over
# http://server:8080 (docker-compose.yml), never through this proxy.
#
# For the Docker installation (docs/12-docker.md §8): server on 127.0.0.1:7070
# (ALERTING_PORT), panel on 127.0.0.1:7071 (ALERTING_PANEL_PORT). Copy to
# /etc/nginx/conf.d/, replace alert.example.org and the certificate paths, `nginx -t`.
# The two-node production proxy (alerting.conf) is unchanged; this is its single-host
# counterpart with the panel added.
#
# Why --proxy-headers is safe for /v1: every request carries a per-person Ed25519
# signature over method, path, query string and body hash (alerting.conf explains).
# The panel's own requests are a session token plus the X-Alerting-Panel header;
# nothing this proxy sets grants authority to either.

upstream alerting_api   { server 127.0.0.1:7070; keepalive 8; }   # ALERTING_PORT
upstream alerting_panel { server 127.0.0.1:7071; keepalive 8; }   # ALERTING_PANEL_PORT

limit_req_zone  $binary_remote_addr zone=alerting_write:10m rate=10r/s;
limit_req_zone  $binary_remote_addr zone=alerting_read:10m  rate=30r/s;
limit_req_zone  $binary_remote_addr zone=alerting_login:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=alerting_ws:10m;

server {
    listen 443 ssl;
    http2 on;
    server_name alert.example.org;                         # ADJUST: ваш домен

    ssl_certificate     /etc/ssl/alerting/fullchain.pem;   # ADJUST
    ssl_certificate_key /etc/ssl/alerting/privkey.pem;     # ADJUST
    include /etc/nginx/conf.d/alerting-tls-params.conf;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    client_max_body_size 64k;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # ---- API сервера ------------------------------------------------------------

    location /v1/stream {
        proxy_pass http://alerting_api;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        limit_conn alerting_ws 10;
    }

    location ~ ^/v1/(proposals|acks|audit/head) {
        limit_req zone=alerting_write burst=20 nodelay;
        proxy_pass http://alerting_api;
    }

    location /v1/audit {
        limit_req zone=alerting_read burst=10;
        proxy_read_timeout 60s;
        proxy_pass http://alerting_api;
    }

    # Readiness names the broken subsystem; metrics are a full picture. Not public.
    location ~ ^/v1/(healthz|readyz|metricsz)$ {
        allow 127.0.0.1;
        deny all;
        access_log off;
        proxy_pass http://alerting_api;
    }

    # The RSS feed of real alerts: inside the organisation only. Add your office
    # networks; the rest of the world gets 403. If another proxy stands in front of
    # this one, every request arrives from ITS address -- then either filter there,
    # or set_real_ip_from that proxy and real_ip_header X-Forwarded-For here.
    location = /v1/feed.rss {
        allow 127.0.0.1;
        allow 10.0.0.0/8;                                  # ADJUST: внутренние сети
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        limit_req zone=alerting_read burst=20;
        proxy_pass http://alerting_api;
    }

    location /v1/ {
        limit_req zone=alerting_read burst=20;
        proxy_pass http://alerting_api;
    }

    # ---- Панель и приложение ЛПР ------------------------------------------------

    # Logging in costs a signature check and a server round trip; a stranger has no
    # business doing it often. The demo password login must not be reachable at all
    # from outside -- ALERTING_PANEL_DEMO_KEYS=0 on a real installation.
    location ~ ^/api/(device/begin|device/renew/begin|login)$ {
        limit_req zone=alerting_login burst=10 nodelay;
        proxy_pass http://alerting_panel;
    }

    location = /healthz {
        allow 127.0.0.1;
        deny all;
        access_log off;
        proxy_pass http://alerting_panel;
    }

    location / {
        limit_req zone=alerting_read burst=40;
        proxy_pass http://alerting_panel;
    }
}

server {
    listen 80;
    server_name alert.example.org;                         # ADJUST: ваш домен
    return 301 https://$host$request_uri;
}
