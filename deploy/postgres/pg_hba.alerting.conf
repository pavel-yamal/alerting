# Кто и откуда пускается в базу. Дописывается в pg_hba.conf установщиком
# (deploy/install/db-primary.sh), адреса подставляются из deploy/inventory.env.
#
# Раньше этого файла не было, потому что база жила на том же хосте: всё ходило через
# unix-сокет и peer-аутентификацию. На отдельной ВМ по умолчанию не проходит НИЧЕГО —
# PostgreSQL не пускает по сети никого, пока здесь не появится строка. Это правильное
# умолчание и одновременно первое, обо что останавливается развёртывание.
#
# Порядок строк значим: PostgreSQL берёт ПЕРВОЕ совпадение и на этом останавливается.
# Поэтому здесь нет ни одной широкой строки вроде `host all all 0.0.0.0/0`: она
# перекрыла бы всё, что ниже, и сделала бы остальные украшением.
#
# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Локальный суперпользователь. Ему нужен доступ для roles.sql, для учебного
# восстановления и для того, чтобы сбросить залипший слот репликации — операций, у
# которых нет пароля и не должно быть.
local   all             postgres                                peer

# Роль приложения с узлов. Только к базе `alerting`, только с двух адресов —
# не с подсети: узлов ровно два, они известны поимённо, и подсеть здесь была бы
# разрешением для машин, которых ещё нет.
host    alerting        alerting_app    10.0.10.11/32           scram-sha-256   # ALERTING_APP1_ADDR
host    alerting        alerting_app    10.0.10.12/32           scram-sha-256   # ALERTING_APP2_ADDR

# Роль владельца — с тех же узлов, потому что миграции применяет
# alerting-migrate.service, который живёт на узле приложения. Это единственное, зачем
# владельцу сеть; всё остальное он делает с консоли базы через unix-сокет.
host    alerting        alerting_owner  10.0.10.11/32           scram-sha-256   # ALERTING_APP1_ADDR
host    alerting        alerting_owner  10.0.10.12/32           scram-sha-256   # ALERTING_APP2_ADDR

# Владелец с самой машины базы — для ночного бэкапа (`pg_dump` читает триггеры и
# гранты, которых роль приложения не видит) и для учебного восстановления.
host    alerting        alerting_owner  127.0.0.1/32            scram-sha-256
host    postgres        alerting_owner  127.0.0.1/32            scram-sha-256

# Репликация. Обе машины базы, а не только резерв: после переключения роли меняются
# местами, и правило, знающее одно направление, пришлось бы править в тот момент,
# когда его правит человек посреди аварии.
host    replication     alerting_repl   10.0.10.21/32           scram-sha-256   # ALERTING_DB_PRIMARY_ADDR
host    replication     alerting_repl   10.0.10.22/32           scram-sha-256   # ALERTING_DB_STANDBY_ADDR

# Дальше — ничего. Всё, что не совпало, PostgreSQL отвергает, и это то поведение,
# которое здесь нужно.
