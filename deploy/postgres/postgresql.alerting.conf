# Настройки PostgreSQL для узла базы. Кладётся в conf.d как отдельный файл, а не
# правкой postgresql.conf: так видно, что изменено этой системой, и обновление пакета
# не затирает изменения молча.
#
#   /etc/postgresql/16/main/conf.d/alerting.conf
#
# Адреса подставляет deploy/install/db-primary.sh из deploy/inventory.env.

# Слушать сеть, а не только unix-сокет. Умолчание Debian — `localhost`, и с ним база
# на отдельной ВМ недоступна ниоткуда: соединение не отвергается с внятной ошибкой,
# оно не устанавливается вовсе. Конкретный адрес, а не `*`: слушать все интерфейсы
# на машине с персональными данными незачем.
listen_addresses = '10.0.10.21'          # ALERTING_DB_PRIMARY_ADDR (на резерве — свой)

# --- репликация ---------------------------------------------------------------
# Умолчания PostgreSQL 16 уже подходят (`wal_level = replica`,
# `max_wal_senders = 10`, `hot_standby = on`), и они выписаны здесь явно не ради
# изменения, а ради того, чтобы смена умолчания в будущей версии не поменяла
# поведение системы без единой строки в diff.
wal_level = replica
max_wal_senders = 10
hot_standby = on

# Слотов ровно столько, сколько резервов. Слот — это обещание хранить WAL, пока его
# не заберут; лишний слот, про который забыли, хранит WAL вечно и заполняет диск той
# машины, которая не имеет права останавливаться.
max_replication_slots = 2

# --- журналирование -----------------------------------------------------------
# Медленные запросы: цепочка аудита сериализует всех пишущих на одной advisory-
# блокировке, и запрос, ждущий её дольше секунды, — это задержка рассылки.
log_min_duration_statement = 1000
log_checkpoints = on
log_connections = on
log_disconnections = on
# Кто именно и откуда — в каждой строке. После инцидента это первое, о чём спросят.
log_line_prefix = '%m [%p] %q%u@%d from %h '

# --- то, что не трогаем, и почему ---------------------------------------------
# `synchronous_commit` остаётся `on` (локальная durability), но синхронной репликации
# здесь нет и не будет: `synchronous_standby_names` пуст намеренно. Основной узел не
# ждёт резерв никогда — система оповещения, переставшая рассылать из-за лежачей
# реплики, это худший отказ из возможных. Цена названа и измерена:
# docs/adr/0009-*.md и docs/10-failover.md.
synchronous_standby_names = ''
